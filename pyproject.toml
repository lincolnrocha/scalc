[project]
name = "calc"
version = "0.1.0"
description = "Calculadora Simples"
authors = [
    {name = "Lincoln S. Rocha",email = "lincoln@dc.ufc.br"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.3.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "calc", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
